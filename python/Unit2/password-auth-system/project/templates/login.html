<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Secure Auth System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-card">
    <div class="auth-card__logo">🔐</div>
    <h1>Welcome Back</h1>
    <p class="auth-card__subtitle">Log in to your account</p>

    <!-- Flash messages (server-side success/error feedback) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form id="login-form" method="POST" action="{{ url_for('login') }}" novalidate>
      <!-- CSRF token: required by Flask-WTF's CSRFProtect on every POST -->
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="username">Username or Email</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-control"
          placeholder="Enter your username or email"
          value="{{ username or '' }}"
          autocomplete="username"
          required
        >
        <div class="field-error" id="username-error"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button type="button" class="toggle-password" data-toggle-password="password" aria-label="Show password">👁️</button>
        </div>
        <div class="field-error" id="password-error"></div>
      </div>

      <button type="submit" class="btn btn-primary">Log In</button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
    </p>
  </div>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
